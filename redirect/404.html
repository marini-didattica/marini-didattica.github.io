<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sito spostato — Marini didattica</title>
    <link rel="canonical" href="https://didattica.mattia-marini.com/" />
    <script>
      (() => {
        const BASE_PATH = "";
        const DESTINATION = "https://didattica.mattia-marini.com";
        // Legacy deck repositories. Their decks live in the consolidated
        // slides site now. Only prefixes without their own GitHub Pages
        // project reach this page (e.g. the renamed `slide-seconde` repo);
        // the mappings are kept here so those old links still resolve.
        const SLIDES_DESTINATION = "https://slides.didattica.mattia-marini.com";
        const DECK_PREFIXES = {
          "/slide-prime": "/prime",
          "/slide-seconde": "/seconde",
          "/slide-olimpiadi": "/olimpiadi",
          "/slide-extra": "/extra",
          "/extra-slides": "/extra",
        };

        const path = (
          location.pathname.startsWith(BASE_PATH)
            ? location.pathname.slice(BASE_PATH.length) || "/"
            : location.pathname
        ).replace(/\/index\.html$/, "/");

        const deck = Object.keys(DECK_PREFIXES).find(
          (prefix) => path === prefix || path.startsWith(prefix + "/"),
        );
        const target = deck
          ? SLIDES_DESTINATION +
            DECK_PREFIXES[deck] +
            encodeURI(path.slice(deck.length) || "/")
          : DESTINATION + encodeURI(path);

        location.replace(target + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>
      Questo sito si è spostato su
      <a href="https://didattica.mattia-marini.com/"
        >didattica.mattia-marini.com</a
      >.
    </p>
  </body>
</html>
